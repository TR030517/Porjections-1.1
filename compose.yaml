name: massajoy2
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a unique root password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-massajoy2}
      MYSQL_USER: massajoy
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a unique database password}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u massajoy --silent']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]
  api:
    image: massajoy2-api:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment: &api-environment
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8002
      DATABASE_URL: mysql://massajoy:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-massajoy2}
      JWT_SECRET: ${JWT_SECRET:?Generate a strong JWT secret}
      MERCHANT_CREDENTIAL_VAULT_DIR: /app/.local/store-account-credentials/vault
      # Required by release-env-check; empty interpolation preserves local Compose compatibility.
      MERCHANT_CREDENTIAL_VAULT_KEY: ${MERCHANT_CREDENTIAL_VAULT_KEY:-}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set the HTTPS website origin}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
      PAYMENT_EXTERNAL_ENABLED: ${PAYMENT_EXTERNAL_ENABLED:-false}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-sandbox}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      SQUARE_MERCHANT_ID: ${SQUARE_MERCHANT_ID:-}
      SQUARE_SHOP_ID: ${SQUARE_SHOP_ID:-}
      SQUARE_CURRENCY: ${SQUARE_CURRENCY:-USD}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      SQUARE_WEBHOOK_NOTIFICATION_URL: ${SQUARE_WEBHOOK_NOTIFICATION_URL:-}
      SQUARE_CHECKOUT_REDIRECT_URL: ${SQUARE_CHECKOUT_REDIRECT_URL:-}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-0}
      BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-15}
      REFUND_POLICY_FULL_HOURS: ${REFUND_POLICY_FULL_HOURS:-}
      REFUND_POLICY_PARTIAL_PERCENT: ${REFUND_POLICY_PARTIAL_PERCENT:-}
      AUTH_LOCAL_OTP: "false"
      AUTH_GOOGLE_CLIENT_IDS: ${AUTH_GOOGLE_CLIENT_IDS:-}
      AUTH_GOOGLE_WEB_CLIENT_ID: ${AUTH_GOOGLE_WEB_CLIENT_ID:-}
      AUTH_APPLE_CLIENT_IDS: ${AUTH_APPLE_CLIENT_IDS:-}
      AUTH_APPLE_WEB_CLIENT_ID: ${AUTH_APPLE_WEB_CLIENT_ID:-}
      AUTH_APPLE_WEB_REDIRECT_URI: ${AUTH_APPLE_WEB_REDIRECT_URI:-}
      AUTH_EMAIL_PROVIDER: ${AUTH_EMAIL_PROVIDER:-}
      AUTH_EMAIL_API_KEY: ${AUTH_EMAIL_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      AUTH_EMAIL_LOCAL_OTP: "false"
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-true}
      BOOKING_ONLINE_PAYMENT_ENABLED: ${BOOKING_ONLINE_PAYMENT_ENABLED:-false}
      ORDER_EMAIL_ENABLED: ${ORDER_EMAIL_ENABLED:-false}
      ORDER_EMAIL_PROVIDER: ${ORDER_EMAIL_PROVIDER:-resend}
      ORDER_EMAIL_API_KEY: ${ORDER_EMAIL_API_KEY:-}
      ORDER_EMAIL_FROM: ${ORDER_EMAIL_FROM:-}
      MEDIA_STORAGE_DRIVER: ${MEDIA_STORAGE_DRIVER:-disabled}
      MEDIA_LOCAL_DIR: /app/media
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - media:/app/media
      # Mount the parent so restore can create a new vault leaf atomically.
      - merchant_credentials:/app/.local/store-account-credentials
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8002/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]
  migrate:
    image: massajoy2-api:${RELEASE_TAG:-local}
    profiles: [tools]
    environment: *api-environment
    command: [node, node_modules/prisma/build/index.js, migrate, deploy]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
  web:
    image: massajoy2-web:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set the public domain}
      TLS_EMAIL: ${TLS_EMAIL:?Set certificate notification email}
    ports:
      - ${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80
      - ${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443
    volumes:
      - tls_data:/data
      - tls_config:/config
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      # Caddy's loopback admin endpoint checks the running gateway without relying on public DNS/TLS.
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:2019/config/']
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal, public]
networks:
  internal:
  public:
volumes:
  media:
  merchant_credentials:
  database:
  tls_data:
  tls_config:
